<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جمعية 30,000</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ee; --card:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e6e1d8;
    --accent:#0f766e; --accent2:#b45309; --hl:#ecfdf5;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14171a; --card:#1d2125; --ink:#eef0f2; --muted:#9aa3ad; --line:#2e3439; --accent:#2dd4bf; --accent2:#f59e0b; --hl:#12302c; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif}
  header{padding:20px 16px 0;text-align:center}
  header h1{margin:0;font-size:1.6rem;font-weight:800}
  header p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
  .tabs{display:flex;gap:8px;justify-content:center;margin:18px 16px 0}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;
       padding:10px 22px;border-radius:999px;cursor:pointer}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  main{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
  .panel{display:none}.panel.active{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .wheel-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  @media (max-width:760px){.wheel-layout{grid-template-columns:1fr}}
  .wheel-wrap{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:1}
  canvas{width:100%;height:100%;display:block}
  .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
           border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--accent2);
           filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2}
  .btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  button.main{background:var(--accent);color:#fff;border:0;font:inherit;font-weight:800;font-size:1.1rem;
              padding:12px 34px;border-radius:12px;cursor:pointer}
  button.main:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font:inherit;padding:12px 18px;border-radius:12px;cursor:pointer}
  .result{margin-top:14px;text-align:center;min-height:56px;font-size:1.05rem}
  .result b{color:var(--accent);font-size:1.25rem}
  h2{margin:0 0 12px;font-size:1.15rem}
  ol.draws{list-style:none;margin:0;padding:0}
  ol.draws li{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line)}
  ol.draws li:last-child{border-bottom:0}
  ol.draws li.pending{color:var(--muted)}
  ol.draws li.new{background:var(--hl);border-radius:8px}
  .month{font-weight:600;white-space:nowrap}
  .tag{font-size:.75rem;background:var(--hl);color:var(--accent);padding:1px 8px;border-radius:999px;margin-inline-start:6px}
  table{width:100%;border-collapse:collapse;font-size:.95rem}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right}
  th{color:var(--muted);font-weight:600;font-size:.85rem}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.share-start td{border-top:2px solid var(--line)}
  tfoot td{font-weight:800}
  .table-scroll{overflow-x:auto}
  .note{color:var(--muted);font-size:.9rem;margin:0 0 12px}
  .grid2{display:grid;gap:18px}
</style>
</head>
<body>
<header>
  <h1>جمعية الـ 30,000</h1>
  <p>10 مشاركات × 3,000 شهرياً — تبدأ 1-10-2026</p>
</header>

<div class="tabs">
  <button class="tab active" data-tab="wheel">عجلة الحظ</button>
  <button class="tab" data-tab="list">الأسماء والتوزيع</button>
</div>

<main>
  <section class="panel active" id="wheel">
    <div class="wheel-layout">
      <div class="card">
        <div class="wheel-wrap">
          <div class="pointer"></div>
          <canvas id="cv" width="880" height="880"></canvas>
        </div>
        <div class="btns">
          <button class="main" id="spin">أدِر العجلة</button>
          <button class="ghost" id="reset">إعادة القرعة</button>
        </div>
        <div class="result" id="result">المشاركة الأولى (علي + ايات) ثابتة لشهر تشرين الأول 2026</div>
      </div>
      <div class="card">
        <h2>نتيجة القرعة</h2>
        <ol class="draws" id="draws"></ol>
      </div>
    </div>
  </section>

  <section class="panel" id="list">
    <div class="grid2">
      <div class="card">
        <h2>توزيع المشاركات</h2>
        <p class="note" id="orderNote"></p>
        <div class="table-scroll"><table id="sharesTable"></table></div>
      </div>
      <div class="card">
        <h2>ملخص كل شخص</h2>
        <div class="table-scroll"><table id="peopleTable"></table></div>
      </div>
    </div>
  </section>
</main>

<script>
const POT = 30000, MONTHS_COUNT = 10;
const SHARES = [
  {n:1,  m:[['علي',1000],['ايات',2000]]},
  {n:2,  m:[['خليل',1000],['ايمن',2000]]},
  {n:3,  m:[['احمد احسان',3000]]},
  {n:4,  m:[['اواب',3000]]},
  {n:5,  m:[['سارة',3000]]},
  {n:6,  m:[['احمد سعد',1000],['علي',500],['احمد احسان',1500]]},
  {n:7,  m:[['محمد اتصالات',3000]]},
  {n:8,  m:[['زينة',1500],['علي الطويل',1500]]},
  {n:9,  m:[['ايناس',500],['دعاء',1500],['حسن',1000]]},
  {n:10, m:[['دندون',3000]]},
];
const MONTH_NAMES = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
function monthLabel(i){ // i = 0 → Oct 2026
  const d = new Date(2026, 9 + i, 1);
  return MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();
}
const fmt = n => n.toLocaleString('en-US');
const byN = n => SHARES.find(s => s.n === n);
const names = s => s.m.map(x => x[0]).join(' + ');

// ---------- state ----------
const KEY = 'jamiya30000-draw';
let drawn = [1];          // order of shares drawn; share 1 fixed first
let lastNew = null;
try { const s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s) && s[0] === 1) drawn = s; } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(drawn)); } catch(e){} };
const remaining = () => SHARES.filter(s => !drawn.includes(s.n));

// ---------- wheel ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const COLORS = ['#0f766e','#b45309','#7c3aed','#be123c','#1d4ed8','#4d7c0f','#c2410c','#0e7490','#a21caf'];
let rot = 0, spinning = false;

function drawWheel(){
  const W = cv.width, c = W/2, r = c - 16;
  ctx.clearRect(0,0,W,W);
  const segs = remaining();
  if (!segs.length){
    ctx.beginPath(); ctx.arc(c,c,r,0,Math.PI*2); ctx.fillStyle='#0f766e'; ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='800 52px Cairo'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('اكتملت القرعة', c, c); return;
  }
  const arc = Math.PI*2 / segs.length;
  segs.forEach((s,i) => {
    const a0 = rot + i*arc, a1 = a0 + arc;
    ctx.beginPath(); ctx.moveTo(c,c); ctx.arc(c,c,r,a0,a1); ctx.closePath();
    ctx.fillStyle = COLORS[(s.n-2) % COLORS.length]; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=4; ctx.stroke();
    ctx.save(); ctx.translate(c,c); ctx.rotate(a0 + arc/2);
    ctx.fillStyle='#fff'; ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.direction='ltr';
    const label = names(s);
    let size = 30; ctx.font = `800 ${size}px Cairo`;
    const maxW = r - 110;
    while (ctx.measureText(label).width > maxW && size > 16){ size--; ctx.font = `800 ${size}px Cairo`; }
    ctx.fillText(label, r - 28, segs.length === 1 ? 0 : -10);
    ctx.font = '600 20px Cairo'; ctx.globalAlpha = .85;
    ctx.fillText('مشاركة ' + s.n, r - 28, segs.length === 1 ? 34 : 22);
    ctx.restore();
  });
  ctx.beginPath(); ctx.arc(c,c,58,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.lineWidth=6; ctx.strokeStyle='#b45309'; ctx.stroke();
  ctx.fillStyle='#1f2328'; ctx.font='800 26px Cairo'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(segs.length, c, c);
}

function spin(){
  const segs = remaining();
  if (spinning || !segs.length) return;
  spinning = true; updateButtons();
  const k = Math.floor(Math.random() * segs.length);
  const arc = Math.PI*2 / segs.length;
  const TAU = Math.PI*2;
  const target = ((-Math.PI/2 - (k + 0.3 + Math.random()*0.4) * arc) % TAU + TAU) % TAU;
  const cur = ((rot % TAU) + TAU) % TAU;
  const delta = ((target - cur) + TAU) % TAU + TAU * (6 + Math.floor(Math.random()*3));
  const start = rot, dur = 5200, t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 4);
  (function frame(now){
    const t = Math.min(1, (now - t0) / dur);
    rot = start + delta * ease(t); drawWheel();
    if (t < 1) return requestAnimationFrame(frame);
    const win = segs[k];
    drawn.push(win.n); lastNew = win.n; save();
    const idx = drawn.length - 1;
    document.getElementById('result').innerHTML =
      `مبروك! <b>${names(win)}</b><br>يقبض في ${monthLabel(idx)} — ${fmt(POT)}`;
    spinning = false;
    setTimeout(() => { rot = 0; render(); }, 1400);
    renderDraws(); renderTables(); updateButtons();
  })(t0);
}

function updateButtons(){
  document.getElementById('spin').disabled = spinning || !remaining().length;
  document.getElementById('reset').disabled = spinning;
}

// ---------- lists ----------
function renderDraws(){
  const ol = document.getElementById('draws'); ol.innerHTML = '';
  for (let i = 0; i < MONTHS_COUNT; i++){
    const li = document.createElement('li');
    const s = drawn[i] ? byN(drawn[i]) : null;
    if (!s) li.className = 'pending';
    if (s && s.n === lastNew) li.className = 'new';
    li.innerHTML = `<span class="month">${i+1}. ${monthLabel(i)}</span>
      <span>${s ? names(s) + (i === 0 ? '<span class="tag">ثابت</span>' : '') : '—'}</span>`;
    ol.appendChild(li);
  }
}

function currentOrder(){
  // full draw → use it; otherwise drawn part then the rest in the agreed order
  return drawn.concat(SHARES.map(s => s.n).filter(n => !drawn.includes(n)));
}

function renderTables(){
  const order = currentOrder();
  const complete = drawn.length === MONTHS_COUNT;
  document.getElementById('orderNote').textContent = complete
    ? 'الأشهر حسب نتيجة القرعة.'
    : (drawn.length > 1
        ? `الأشهر الأولى (${drawn.length}) حسب القرعة، والباقي حسب الترتيب المتفق عليه إلى أن تكتمل القرعة.`
        : 'الأشهر حسب الترتيب المتفق عليه. بعد إدارة العجلة تتحدث تلقائياً حسب القرعة.');

  let h = `<thead><tr><th>الشهر</th><th>المشاركة</th><th>الاسم</th><th>الدفع الشهري</th><th>حصته من القبض</th></tr></thead><tbody>`;
  let total = 0;
  order.forEach((n,i) => {
    const s = byN(n);
    s.m.forEach(([name,amt],j) => {
      total += amt;
      h += `<tr class="${j===0?'share-start':''}">`;
      if (j === 0) h += `<td rowspan="${s.m.length}" class="month">${monthLabel(i)}</td><td rowspan="${s.m.length}">${s.n}</td>`;
      h += `<td>${name}</td><td class="num">${fmt(amt)}</td><td class="num">${fmt(amt * MONTHS_COUNT)}</td></tr>`;
    });
  });
  h += `</tbody><tfoot><tr><td colspan="3">المجموع الشهري</td><td class="num">${fmt(total)}</td><td></td></tr></tfoot>`;
  document.getElementById('sharesTable').innerHTML = h;

  // people summary
  const people = new Map();
  order.forEach((n,i) => byN(n).m.forEach(([name,amt]) => {
    if (!people.has(name)) people.set(name, {pay:0, rec:[]});
    const p = people.get(name); p.pay += amt; p.rec.push(`${fmt(amt*MONTHS_COUNT)} في ${monthLabel(i)}`);
  }));
  let p = `<thead><tr><th>الاسم</th><th>يدفع شهرياً</th><th>مجموع ما يدفعه</th><th>يقبض</th></tr></thead><tbody>`;
  people.forEach((v,name) => {
    p += `<tr><td>${name}</td><td class="num">${fmt(v.pay)}</td><td class="num">${fmt(v.pay*MONTHS_COUNT)}</td><td>${v.rec.join('<br>')}</td></tr>`;
  });
  p += `</tbody>`;
  document.getElementById('peopleTable').innerHTML = p;
}

function render(){ drawWheel(); renderDraws(); renderTables(); updateButtons(); }

document.getElementById('spin').onclick = spin;
document.getElementById('reset').onclick = () => {
  if (!confirm('إعادة القرعة من البداية؟')) return;
  drawn = [1]; lastNew = null; rot = 0; save();
  document.getElementById('result').textContent = 'المشاركة الأولى (علي + ايات) ثابتة لشهر تشرين الأول 2026';
  render();
};
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === b.dataset.tab));
});

render();
document.fonts && document.fonts.ready.then(drawWheel);
</script>
</body>
</html>
